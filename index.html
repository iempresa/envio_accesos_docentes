<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico - Instituto de la Empresa</title>
    
    <!-- Librerías -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <style>
        :root {
            --brand-blue: #002855; 
            --brand-orange: #FF5F00;
            --bg-light: #f4f6f9;
            --text-color: #333;
            --border-color: #ddd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e0e4e8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-card {
            display: flex;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 40, 85, 0.15);
            overflow: hidden;
        }

        .image-panel {
            width: 35%;
            background-color: var(--brand-blue);
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .image-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(180deg, rgba(0,40,85,0.9) 0%, rgba(0,40,85,0.7) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; padding: 40px; text-align: center;
        }
        .logo-text { font-size: 2rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .brand-subtitle { font-size: 1rem; color: var(--brand-orange); font-weight: 600; letter-spacing: 1px; }

        .form-panel {
            width: 65%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .progress-bar {
            display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; max-width: 450px; margin-left: auto; margin-right: auto;
        }
        .progress-line {
            position: absolute; top: 50%; left: 0; height: 3px; background: var(--brand-orange);
            width: 0%; transition: width 0.3s ease; z-index: 1; transform: translateY(-50%);
        }
        .progress-bg {
            position: absolute; top: 50%; left: 0; height: 3px; background: #e9ecef;
            width: 100%; z-index: 0; transform: translateY(-50%);
        }
        .step-circle {
            width: 40px; height: 40px; background: #e9ecef; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #999; z-index: 2; transition: 0.3s; border: 3px solid white; font-size: 1.1rem;
        }
        .step-circle.active { background: var(--brand-blue); color: white; box-shadow: 0 0 0 4px rgba(0, 40, 85, 0.1); }

        .section-title { font-size: 1.3rem; color: var(--brand-blue); margin-bottom: 25px; border-left: 5px solid var(--brand-orange); padding-left: 15px; font-weight: 600; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 500; color: #555; margin-bottom: 8px; }
        
        input[type="text"], textarea, select, input[type="date"], input[type="time"] { 
            width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 0.95rem; background-color: #fcfcfc; transition: all 0.3s; font-family: inherit;
        }
        input:focus, textarea:focus, select:focus { 
            outline: none; border-color: var(--brand-orange); 
            background-color: #fff; box-shadow: 0 0 0 3px rgba(255, 95, 0, 0.1); 
        }

        .row { display: flex; gap: 20px; width: 100%; }
        .col { flex: 1; min-width: 0; }

        .carrera-block {
            background: #f8f9fa; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; position: relative;
        }
        .btn-remove-carrera {
            position: absolute; top: 10px; right: 10px; background: none; border: none; color: #dc3545; cursor: pointer;
        }
        .btn-add-carrera {
            background: #fff; color: var(--brand-blue); border: 2px dashed var(--brand-blue); width: 100%; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 20px;
        }

        .nav-buttons {
            margin-top: auto; padding-top: 30px; border-top: 1px solid #eee;
            display: flex; justify-content: space-between; gap: 15px;
        }
        .btn {
            padding: 14px 30px; border-radius: 8px; border: none; font-weight: 600; 
            cursor: pointer; transition: 0.3s; font-size: 1rem; letter-spacing: 0.5px;
        }
        .btn-prev { background: #e9ecef; color: #555; flex: 1; }
        .btn-next { background: var(--brand-blue); color: white; flex: 2; }
        .btn-submit { background: var(--brand-orange); color: white; flex: 2; }
        
        /* Botón de Vista Previa */
        .btn-preview { background: #5a6268; color: white; width: 100%; margin-bottom: 10px; }
        .btn-preview:hover { background: #495057; }

        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .date-tool { background-color: #f0f4f8; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e0; margin-bottom: 10px; }
        .btn-add { background-color: var(--brand-blue); color: white; border: none; width: 50px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="image-panel">
            <div class="image-overlay">
                <div class="logo-text">IEmpresa</div>
                <div class="brand-subtitle">Gestión Académica</div>
                <i class="fa-solid fa-graduation-cap" style="font-size: 3rem; margin-top: 30px; color: white;"></i>
            </div>
        </div>

        <div class="form-panel">
            <div class="progress-bar">
                <div class="progress-bg"></div>
                <div class="progress-line" id="progressLine"></div>
                <div class="step-circle active">1</div>
                <div class="step-circle">2</div>
                <div class="step-circle">3</div>
                <div class="step-circle">4</div>
            </div>

            <form id="accessForm">
                <!-- PASO 1 -->
                <div class="step active">
                    <div class="section-title">Información del Curso</div>
                    <div class="field-group">
                        <label style="color: var(--brand-orange); font-weight:700;">📧 Enviar a (Correo Docente):</label>
                        <input type="text" id="destinatarios" name="destinatarios" placeholder="docente@ejemplo.com">
                    </div>
                    <div class="field-group"><label>Nombre del Curso:</label><input type="text" id="curso" name="curso"></div>
                    <div class="row">
                        <div class="col field-group"><label>Ciclo:</label><input type="text" id="ciclo" name="ciclo"></div>
                        <div class="col field-group"><label>Docente:</label><input type="text" id="docente" name="docente"></div>
                    </div>
                    <div class="field-group">
                        <label>Horarios:</label>
                        <div class="date-tool">
                            <div class="row" style="gap:5px;">
                                <input type="date" id="tool-date" class="col">
                                <input type="time" id="tool-start" value="16:00" class="col">
                                <input type="time" id="tool-end" value="17:30" class="col">
                                <button type="button" class="btn-add" onclick="addDate()"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <textarea id="horarios" name="horarios" rows="3"></textarea>
                    </div>
                </div>

                <!-- PASO 2 -->
                <div class="step">
                    <div class="section-title">Plataformas Virtuales</div>
                    <label style="font-weight:bold; color:#6264A7; margin-bottom:10px; display:block;"><i class="fa-brands fa-microsoft"></i> MICROSOFT TEAMS</label>
                    <div class="field-group"><input type="text" id="teamsLink" name="teamsLink" placeholder="Enlace de la Reunión"></div>
                    <div class="row">
                        <div class="col field-group"><input type="text" id="teamsUser" name="teamsUser" placeholder="Usuario"></div>
                        <div class="col field-group"><input type="text" id="teamsPass" name="teamsPass" placeholder="Contraseña"></div>
                    </div>
                    <hr style="margin: 25px 0; border:0; border-top:1px solid #eee;">
                    <label style="font-weight:bold; color:var(--brand-blue); margin-bottom:10px; display:block;"><i class="fa-solid fa-school"></i> CAMPUS VIRTUAL</label>
                    <div class="row">
                        <div class="col field-group"><input type="text" id="campusUser" name="campusUser" placeholder="Usuario (Email Personal)"></div>
                        <div class="col field-group"><input type="text" id="campusPass" name="campusPass" placeholder="Contraseña"></div>
                    </div>
                </div>

                <!-- PASO 3 -->
                <div class="step">
                    <div class="section-title">Material por Carrera</div>
                    <div id="carrerasContainer"></div>
                    <button type="button" class="btn-add-carrera" onclick="addCarreraBlock()">
                        <i class="fa-solid fa-plus-circle"></i> Añadir otra carrera (Si aplica)
                    </button>
                </div>

                <!-- PASO 4 -->
                <div class="step">
                    <div class="section-title">Confirmar Envío</div>
                    
                    <div id="informesFinalesContainer"></div>

                    <div style="background: #e7f6eb; padding: 20px; border-radius: 10px; margin-top: 30px; text-align: center; border: 1px solid #c3e6cb;">
                        <i class="fa-solid fa-circle-check" style="font-size: 2.5rem; color: #198754; margin-bottom: 15px;"></i>
                        <p style="color:#198754; font-weight:600;">Revise la vista previa antes de enviar.</p>
                    </div>
                    
                    <div class="nav-buttons" style="border:none; margin-top: 20px; flex-direction: column; gap: 10px;">
                        <!-- BOTÓN VISTA PREVIA -->
                        <button type="button" class="btn btn-preview" onclick="previewEmail()">
                            <i class="fa-solid fa-eye"></i> VISTA PREVIA DEL CORREO
                        </button>
                        <div style="display: flex; width: 100%; gap: 15px;">
                            <button type="button" class="btn btn-prev" onclick="changeStep(-1)">Atrás</button>
                            <button type="button" class="btn btn-submit" onclick="sendData()">ENVIAR ACCESOS</button>
                        </div>
                    </div>
                </div>

                <!-- NAVEGACIÓN PASOS 1-3 -->
                <div class="nav-buttons" id="navControls">
                    <button type="button" class="btn btn-prev" id="prevBtn" onclick="changeStep(-1)">Atrás</button>
                    <button type="button" class="btn btn-next" id="nextBtn" onclick="changeStep(1)">Siguiente</button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyw1_xBRxeWFaEiDcmFRuuvBFAdOtM0wsAhgKzEvoaPccDhAizg0FSbWLVH4_RcmrLO/exec"; 

        const PLANTILLAS = {
            "Administración de Negocios Internacionales": "https://docs.google.com/presentation/d/13CAk39hOZLwzU-exQvXwsyLLqnANWwYT7Wab7UqeKD0/edit?usp=sharing",
            "Contabilidad": "https://docs.google.com/presentation/d/1gDVjw6H38lnRzK76hV0V8CCI3EPEJRoBpajLddRf_8c/edit?usp=sharing"
        };

        const INFORMES_FINAL = {
            "Administración de Negocios Internacionales": "https://docs.google.com/document/d/1IvYdns_fEvT8KCbe9z7Lt5gZPEEtahM4HgjqBEkvLeI/edit?usp=drive_link",
            "Contabilidad": "https://docs.google.com/document/d/15hAjq_wLVmabTrRkyDoCQh9ZA6VMJYwxQaWnf8zOePI/edit?tab=t.0" 
        };

        let currentStep = 0;
        let carreraCount = 0;
        const steps = document.querySelectorAll('.step');
        const circles = document.querySelectorAll('.step-circle');
        const progressLine = document.getElementById('progressLine');
        const navControls = document.getElementById('navControls');

        document.addEventListener('DOMContentLoaded', () => {
            addCarreraBlock();
            updateUI();
        });

        function addCarreraBlock() {
            carreraCount++;
            const container = document.getElementById('carrerasContainer');
            const div = document.createElement('div');
            div.className = 'carrera-block';
            div.id = `block-carrera-${carreraCount}`;
            div.innerHTML = `
                ${carreraCount > 1 ? `<button type="button" class="btn-remove-carrera" onclick="removeCarreraBlock(${carreraCount})"><i class="fa-solid fa-trash"></i></button>` : ''}
                <div class="field-group">
                    <label>Programa / Carrera:</label>
                    <select name="c${carreraCount}Nombre" class="carrera-select" onchange="updatePlantillaLink(${carreraCount}, this.value)">
                        <option value="" disabled selected>Seleccione una carrera...</option>
                        <option value="Administración de Negocios Internacionales">Administración de Negocios Internacionales</option>
                        <option value="Contabilidad">Contabilidad</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Link Campus:</label>
                    <input type="text" name="c${carreraCount}Link" placeholder="Link del Campus">
                </div>
                <div class="row">
                    <div class="col field-group">
                        <label>Link Drive:</label>
                        <input type="text" name="c${carreraCount}Drive" placeholder="Link Carpeta Drive">
                    </div>
                    <div class="col field-group">
                        <label>Link Plantilla:</label>
                        <input type="text" id="c${carreraCount}Plantilla" name="c${carreraCount}Plantilla" readonly style="background:#f0f0f0;">
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        function removeCarreraBlock(id) {
            document.getElementById(`block-carrera-${id}`).remove();
            updateInformesFinales();
        }

        function updatePlantillaLink(id, carrera) {
            document.getElementById(`c${id}Plantilla`).value = PLANTILLAS[carrera] || "";
            updateInformesFinales();
        }

        function updateInformesFinales() {
            const container = document.getElementById('informesFinalesContainer');
            container.innerHTML = ''; 
            const selects = document.querySelectorAll('.carrera-select');
            const seleccionadas = new Set();
            selects.forEach(s => { if(s.value) seleccionadas.add(s.value); });

            if (seleccionadas.size === 0) {
                container.innerHTML = '<p style="color:red; font-size:0.8rem;">⚠️ Seleccione una carrera en el paso anterior.</p>';
                return;
            }

            seleccionadas.forEach(carrera => {
                const url = INFORMES_FINAL[carrera];
                const labelName = carrera === "Administración de Negocios Internacionales" ? "Admin" : "Conta";
                const div = document.createElement('div');
                div.className = 'field-group';
                div.innerHTML = `
                    <label>Link Modelo Informe Final (${carrera}):</label>
                    <input type="text" name="finalLink_${labelName}" value="${url}" readonly style="background:#f8f9fa; border: 1px solid #c3e6cb;">
                `;
                container.appendChild(div);
            });
        }

        function updateUI() {
            steps.forEach((s, i) => s.classList.toggle('active', i === currentStep));
            circles.forEach((c, i) => c.classList.toggle('active', i <= currentStep));
            progressLine.style.width = ((currentStep / (steps.length - 1)) * 100) + "%";
            navControls.style.display = (currentStep === steps.length - 1) ? 'none' : 'flex';
            document.getElementById('prevBtn').style.visibility = (currentStep === 0) ? 'hidden' : 'visible';
            
            if(currentStep === 3) updateInformesFinales();
        }

        function changeStep(n) {
            currentStep += n;
            updateUI();
        }

        function addDate() {
            const d = document.getElementById('tool-date').value;
            const s = document.getElementById('tool-start').value;
            const e = document.getElementById('tool-end').value;
            const txt = document.getElementById('horarios');
            if(!d) return;
            const dateObj = new Date(d + 'T00:00:00');
            const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
            const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
            const linea = `${dias[dateObj.getDay()]} ${dateObj.getDate()} ${meses[dateObj.getMonth()]} / ${s} - ${e}`;
            txt.value += (txt.value ? "\n" : "") + linea;
        }

        // --- FUNCIONES DE COMUNICACIÓN CON APPS SCRIPT ---

        function previewEmail() {
            Swal.fire({
                title: 'Generando vista previa...',
                text: 'Esto puede tardar unos segundos.',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const data = { action: "preview" };
            new FormData(document.getElementById('accessForm')).forEach((v, k) => data[k] = v);

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(res => {
                if(res.result === "success") {
                    Swal.fire({
                        title: 'Vista Previa del Correo Oficial',
                        html: `<div style="text-align:left; border:1px solid #ddd; padding:15px; height:450px; overflow-y:auto; background:#fff; border-radius:8px;">${res.html}</div>`,
                        width: '700px',
                        confirmButtonText: 'Cerrar Vista Previa',
                        confirmButtonColor: '#002855'
                    });
                } else {
                    throw new Error(res.error);
                }
            })
            .catch(e => Swal.fire('Error', 'No se pudo generar la vista previa: ' + e.message, 'error'));
        }

        function sendData() {
            Swal.fire({
                title: '¿Confirmar envío?',
                text: "Se enviarán los accesos al correo del docente.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#FF5F00',
                cancelButtonColor: '#5a6268',
                confirmButtonText: 'Sí, enviar ahora',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Enviando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    const data = { action: "send" };
                    new FormData(document.getElementById('accessForm')).forEach((v, k) => data[k] = v);
                    
                    fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
                    .then(res => res.json())
                    .then(res => {
                        if(res.result === "success") {
                            Swal.fire({ icon: 'success', title: '¡Enviado!', text: res.message, confirmButtonColor: '#002855' });
                        } else {
                            throw new Error(res.error);
                        }
                    })
                    .catch(e => Swal.fire('Error', e.message, 'error'));
                }
            });
        }
    </script>
</body>
</html>
