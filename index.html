<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Académico - Instituto de la Empresa</title>
    
    <!-- Librerías -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    
    <style>
        :root {
            /* COLORES INSTITUTO DE LA EMPRESA */
            --brand-blue: #002855; 
            --brand-orange: #FF5F00;
            --bg-light: #f4f6f9;
            --text-color: #333;
            --border-color: #ddd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #e0e4e8;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARD PRINCIPAL */
        .main-card {
            display: flex;
            width: 95%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 40, 85, 0.15);
            overflow: hidden;
        }

        /* IZQUIERDA: IMAGEN/BRANDING */
        .image-panel {
            width: 35%;
            background-color: var(--brand-blue);
            background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .image-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(180deg, rgba(0,40,85,0.9) 0%, rgba(0,40,85,0.7) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; padding: 40px; text-align: center;
        }
        .logo-text { font-size: 2rem; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        .brand-subtitle { font-size: 1rem; color: var(--brand-orange); font-weight: 600; letter-spacing: 1px; }

        /* DERECHA: FORMULARIO */
        .form-panel {
            width: 65%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        /* STEPPER */
        .progress-bar {
            display: flex; justify-content: space-between; margin-bottom: 40px; position: relative; max-width: 450px; margin-left: auto; margin-right: auto;
        }
        .progress-line {
            position: absolute; top: 50%; left: 0; height: 3px; background: var(--brand-orange);
            width: 0%; transition: width 0.3s ease; z-index: 1; transform: translateY(-50%);
        }
        .progress-bg {
            position: absolute; top: 50%; left: 0; height: 3px; background: #e9ecef;
            width: 100%; z-index: 0; transform: translateY(-50%);
        }
        .step-circle {
            width: 40px; height: 40px; background: #e9ecef; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #999; z-index: 2; transition: 0.3s; border: 3px solid white; font-size: 1.1rem;
        }
        .step-circle.active { background: var(--brand-blue); color: white; box-shadow: 0 0 0 4px rgba(0, 40, 85, 0.1); }

        /* INPUTS */
        .section-title { font-size: 1.3rem; color: var(--brand-blue); margin-bottom: 25px; border-left: 5px solid var(--brand-orange); padding-left: 15px; font-weight: 600; }
        .field-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; font-weight: 500; color: #555; margin-bottom: 8px; }
        
        input[type="text"], textarea, select, input[type="date"], input[type="time"] { 
            width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 8px; 
            font-size: 0.95rem; background-color: #fcfcfc; transition: all 0.3s; font-family: inherit;
        }
        input:focus, textarea:focus { 
            outline: none; border-color: var(--brand-orange); 
            background-color: #fff; box-shadow: 0 0 0 3px rgba(255, 95, 0, 0.1); 
        }

        /* CORRECCIÓN DE LAYOUT (GRID) */
        .row { display: flex; gap: 20px; width: 100%; }
        .col { flex: 1; min-width: 0; }

        /* HERRAMIENTA FECHAS */
        .date-tool {
            background-color: #f0f4f8; padding: 15px; border-radius: 8px; 
            border: 1px dashed #cbd5e0; margin-bottom: 10px;
        }
        .btn-add {
            background-color: var(--brand-blue); color: white; border: none; width: 50px; 
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .btn-add:hover { background-color: #003a75; }

        /* NAVEGACIÓN */
        .nav-buttons {
            margin-top: auto; padding-top: 30px; border-top: 1px solid #eee;
            display: flex; justify-content: space-between;
        }
        .btn {
            padding: 14px 30px; border-radius: 8px; border: none; font-weight: 600; 
            cursor: pointer; transition: 0.3s; font-size: 1rem; letter-spacing: 0.5px;
        }
        .btn-prev { background: #e9ecef; color: #555; }
        .btn-prev:hover { background: #dee2e6; color: #333; }
        
        .btn-next { background: var(--brand-blue); color: white; }
        .btn-next:hover { background: #001a38; box-shadow: 0 4px 12px rgba(0, 40, 85, 0.2); }
        
        .btn-submit { background: var(--brand-orange); color: white; width: 100%; }
        .btn-submit:hover { background: #e05400; box-shadow: 0 4px 12px rgba(255, 95, 0, 0.3); }

        @media (max-width: 900px) {
            .main-card { flex-direction: column; height: auto; margin: 20px 0; }
            .image-panel { width: 100%; height: 200px; }
            .form-panel { width: 100%; padding: 30px; }
            .row { flex-direction: column; gap: 10px; }
        }
        
        .step { display: none; animation: fadeIn 0.4s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- IZQUIERDA -->
        <div class="image-panel">
            <div class="image-overlay">
                <div class="logo-text">IEmpresa</div>
                <div class="brand-subtitle">Gestión Académica</div>
                <i class="fa-solid fa-graduation-cap" style="font-size: 3rem; margin-top: 30px; color: white;"></i>
            </div>
        </div>

        <!-- DERECHA -->
        <div class="form-panel">
            
            <div class="progress-bar">
                <div class="progress-bg"></div>
                <div class="progress-line" id="progressLine"></div>
                <div class="step-circle active">1</div>
                <div class="step-circle">2</div>
                <div class="step-circle">3</div>
                <div class="step-circle">4</div>
            </div>

            <form id="accessForm">
                
                <!-- PASO 1 -->
                <div class="step active">
                    <div class="section-title">Información del Curso</div>
                    
                    <div class="field-group">
                        <label style="color: var(--brand-orange); font-weight:700;">📧 Enviar a (Correo Docente):</label>
                        <input type="text" id="destinatarios" name="destinatarios" placeholder="docente@ejemplo.com" style="border: 2px solid var(--brand-blue);">
                    </div>

                    <div class="field-group"><label>Nombre del Curso:</label><input type="text" id="curso" name="curso"></div>
                    
                    <div class="row">
                        <div class="col field-group"><label>Ciclo:</label><input type="text" id="ciclo" name="ciclo"></div>
                        <div class="col field-group"><label>Docente:</label><input type="text" id="docente" name="docente"></div>
                    </div>

                    <div class="field-group">
                        <label>Horarios:</label>
                        <div class="date-tool">
                            <label style="font-size:0.8rem; color:var(--brand-blue); margin-bottom:5px;">Agregar Sesión:</label>
                            <div class="row" style="gap:5px;">
                                <input type="date" id="tool-date" class="col">
                                <input type="time" id="tool-start" value="16:00" class="col">
                                <input type="time" id="tool-end" value="17:30" class="col">
                                <button type="button" class="btn-add" onclick="addDate()"><i class="fa-solid fa-plus"></i></button>
                            </div>
                        </div>
                        <textarea id="horarios" name="horarios" rows="3" placeholder="Las fechas se agregan aquí..."></textarea>
                    </div>
                </div>

                <!-- PASO 2 -->
                <div class="step">
                    <div class="section-title">Plataformas Virtuales</div>
                    <label style="font-weight:bold; color:#6264A7; margin-bottom:10px; display:block;"><i class="fa-brands fa-microsoft"></i> MICROSOFT TEAMS</label>
                    <div class="field-group"><input type="text" id="teamsLink" name="teamsLink" placeholder="Enlace de la Reunión"></div>
                    <div class="row">
                        <div class="col field-group"><input type="text" id="teamsUser" name="teamsUser" placeholder="Usuario"></div>
                        <div class="col field-group"><input type="text" id="teamsPass" name="teamsPass" placeholder="Contraseña"></div>
                    </div>
                    <hr style="margin: 25px 0; border:0; border-top:1px solid #eee;">
                    <label style="font-weight:bold; color:var(--brand-blue); margin-bottom:10px; display:block;"><i class="fa-solid fa-school"></i> CAMPUS VIRTUAL</label>
                    <div class="row">
                        <div class="col field-group"><input type="text" id="campusUser" name="campusUser" placeholder="Usuario (Email Personal)"></div>
                        <div class="col field-group"><input type="text" id="campusPass" name="campusPass" placeholder="Contraseña"></div>
                    </div>
                </div>

                <!-- PASO 3 -->
                <div class="step">
                    <div class="section-title">Material por Carrera</div>
                    
                    <div class="field-group">
                        <label>Carrera 1:</label>
                        <input type="text" id="c1Nombre" name="c1Nombre" value="Administración de Negocios Internacionales" readonly style="background:#eee; font-weight:bold;">
                    </div>
                    <div class="field-group"><input type="text" id="c1Link" name="c1Link" placeholder="Link Campus"></div>
                    <div class="row">
                        <div class="col field-group"><label>Link Drive:</label><input type="text" id="c1Drive" name="c1Drive" placeholder="Link Drive"></div>
                        <div class="col field-group">
                            <label>Link Plantilla (ADNI):</label>
                            <input type="text" id="c1Plantilla" name="c1Plantilla" value="https://docs.google.com/presentation/d/13CAk39hOZLwzU-exQvXwsyLLqnANWwYT7Wab7UqeKD0/edit?usp=sharing">
                        </div>
                    </div>

                    <hr style="margin: 25px 0; border:0; border-top:1px solid #eee;">

                    <div class="field-group">
                        <label>Carrera 2:</label>
                        <input type="text" id="c2Nombre" name="c2Nombre" value="Contabilidad" readonly style="background:#eee; font-weight:bold;">
                    </div>
                    <div class="field-group"><input type="text" id="c2Link" name="c2Link" placeholder="Link Campus"></div>
                    <div class="row">
                        <div class="col field-group"><label>Link Drive:</label><input type="text" id="c2Drive" name="c2Drive" placeholder="Link Drive"></div>
                        <div class="col field-group">
                            <label>Link Plantilla (CONTA):</label>
                            <input type="text" id="c2Plantilla" name="c2Plantilla" value="https://docs.google.com/presentation/d/1gDVjw6H38lnRzK76hV0V8CCI3EPEJRoBpajLddRf_8c/edit?usp=sharing">
                        </div>
                    </div>
                </div>

                <!-- PASO 4 -->
                <div class="step">
                    <div class="section-title">Confirmar Envío</div>
                    
                    <div class="field-group">
                        <label>Link Modelo Informe Final:</label>
                        <input type="text" id="finalLink" name="finalLink" value="https://docs.google.com/document/d/1IvYdns_fEvT8KCbe9z7Lt5gZPEEtahM4HgjqBEkvLeI/edit?usp=drive_link">
                    </div>

                    <div style="background: #e7f6eb; padding: 20px; border-radius: 10px; margin-top: 30px; text-align: center; border: 1px solid #c3e6cb;">
                        <i class="fa-solid fa-paper-plane" style="font-size: 2.5rem; color: #198754; margin-bottom: 15px;"></i>
                        <p style="color:#198754; font-weight:600;">Todo listo para enviar el correo oficial.</p>
                    </div>

                    <div class="nav-buttons" style="border:none;">
                        <button type="button" class="btn btn-submit" onclick="sendData()">ENVIAR ACCESOS</button>
                    </div>
                </div>

                <!-- NAVEGACIÓN -->
                <div class="nav-buttons" id="navControls">
                    <button type="button" class="btn btn-prev" id="prevBtn" onclick="changeStep(-1)">Atrás</button>
                    <button type="button" class="btn btn-next" id="nextBtn" onclick="changeStep(1)">Siguiente</button>
                </div>

            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // ======================================================
        // ⚠️ PEGA AQUÍ TU URL DE APPS SCRIPT
        // ======================================================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdy2dfH9Q0oKldBDcbtpMe73DPoHWPUJJXQHBpbnJDd1-qviG9LLDn1OPN3WDGuMq0/exec"; 

        let currentStep = 0;
        const steps = document.querySelectorAll('.step');
        const circles = document.querySelectorAll('.step-circle');
        const progressLine = document.getElementById('progressLine');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const navControls = document.getElementById('navControls');

        function updateUI() {
            steps.forEach((s, i) => s.classList.toggle('active', i === currentStep));
            circles.forEach((c, i) => c.classList.toggle('active', i <= currentStep));
            progressLine.style.width = ((currentStep / (steps.length - 1)) * 100) + "%";
            prevBtn.style.visibility = currentStep === 0 ? 'hidden' : 'visible';
            navControls.style.display = (currentStep === steps.length - 1) ? 'none' : 'flex';
        }

        function changeStep(n) {
            if (n === 1 && currentStep === 0) {
                if(!document.getElementById('destinatarios').value) {
                    Swal.fire('Falta Correo', 'Por favor ingresa el correo del destinatario.', 'warning');
                    return;
                }
            }
            currentStep += n;
            updateUI();
        }

        function addDate() {
            const d = document.getElementById('tool-date').value;
            const s = document.getElementById('tool-start').value;
            const e = document.getElementById('tool-end').value;
            const txt = document.getElementById('horarios');
            if(!d) return;
            const dateObj = new Date(d + 'T00:00:00');
            const dias = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
            const fechaStr = `${dias[dateObj.getDay()]} ${dateObj.getDate()} ${meses[dateObj.getMonth()]}`;
            const formatTime = t => {
                let [h, m] = t.split(':');
                let ampm = h >= 12 ? 'pm' : 'am';
                h = h % 12 || 12;
                return `${h}:${m} ${ampm}`;
            };
            const linea = `${fechaStr} / ${formatTime(s)} - ${formatTime(e)}`;
            txt.value += (txt.value ? "\n" : "") + linea;
        }

        function sendData() {
            if(SCRIPT_URL === "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT" || SCRIPT_URL === "") {
                Swal.fire('Error de Configuración', 'No has configurado la URL del script en el código HTML.', 'error');
                return;
            }

            Swal.fire({
                title: 'Enviando...',
                text: 'Generando accesos y enviando correo.',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const form = document.getElementById('accessForm');
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            // Usamos fetch POST 'no-cors' para máxima compatibilidad con GitHub Pages
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => {
                // Al usar Google Apps Script con fetch desde dominio externo,
                // la respuesta suele ser opaca, pero si no da error de red, asumimos éxito.
                Swal.fire({
                    icon: 'success',
                    title: '¡Enviado!',
                    text: 'El correo ha sido enviado y registrado.',
                    confirmButtonColor: '#002855'
                }).then(() => {
                    // Opcional: location.reload();
                });
            })
            .catch(error => {
                Swal.fire('Error', 'Hubo un problema de red: ' + error.message, 'error');
            });
        }

        updateUI();
    </script>
</body>
</html>
